version: "3.9"

services:

  excel-ai-agent:

    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: excel-ai-agent

    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - MODEL=${MODEL}

    volumes:
      - ../output:/app/output
      - ../samples:/app/samples

    working_dir: /app

    command: python main.py
